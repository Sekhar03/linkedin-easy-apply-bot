name: Scheduled LinkedIn Job Apply

on:
  schedule:
    # Runs every day at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-linkedin-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Session & Config from Secrets
        env:
          STATE_B64: ${{ secrets.STATE_JSON_BASE64 }}
          CONFIG_B64: ${{ secrets.CONFIG_JSON_BASE64 }}
        run: |
          node -e "
            const fs = require('fs');
            if (process.env.STATE_B64 && process.env.STATE_B64.trim()) {
              console.log('Restoring state.json from GitHub Secrets...');
              try {
                const cleanB64 = process.env.STATE_B64.replace(/[\s\r\n'"]/g, '');
                const str = Buffer.from(cleanB64, 'base64').toString('utf8');
                JSON.parse(str);
                fs.writeFileSync('state.json', str);
                console.log('Restored state.json (Valid JSON, ' + str.length + ' chars)');
              } catch(e) {
                console.error('Warning: STATE_B64 secret is not valid JSON or was corrupted:', e.message);
              }
            } else {
              console.log('Warning: STATE_JSON_BASE64 secret not found or empty.');
            }
            if (process.env.CONFIG_B64 && process.env.CONFIG_B64.trim()) {
              console.log('Restoring config.json from GitHub Secrets...');
              try {
                const cleanB64 = process.env.CONFIG_B64.replace(/[\s\r\n'"]/g, '');
                const str = Buffer.from(cleanB64, 'base64').toString('utf8');
                JSON.parse(str);
                fs.writeFileSync('config.json', str);
                console.log('Restored config.json (Valid JSON, ' + str.length + ' chars)');
              } catch(e) {
                console.error('Warning: CONFIG_B64 secret is not valid JSON:', e.message);
              }
            }
          "

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run LinkedIn Easy Apply Bot
        env:
          HEADLESS: "true"
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node apply.js

      - name: Upload Applied Jobs Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-jobs-log
          path: applied_jobs.json
          retention-days: 7
